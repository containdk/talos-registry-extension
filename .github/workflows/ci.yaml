name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Build & Test Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Install QEMU System Packages
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-kvm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract Talos Version from Makefile
        id: talos-version
        run: |
          TALOS_VERSION=$(grep -E '^TALOS_VERSION \?=' Makefile | awk '{print $3}')
          # The Makefile pins a series (v1.14); release assets are per patch.
          TALOS_RELEASE=$(./scripts/talos-release.sh "$TALOS_VERSION")
          echo "Talos $TALOS_VERSION resolves to release $TALOS_RELEASE"
          echo "TALOS_VERSION=$TALOS_VERSION" >> $GITHUB_ENV
          # Exported so test-local.sh reuses it instead of resolving again.
          echo "TALOS_RELEASE=$TALOS_RELEASE" >> $GITHUB_ENV
          echo "release=$TALOS_RELEASE" >> $GITHUB_OUTPUT

      - name: Install talosctl
        run: |
          curl -sSfLo talosctl https://github.com/siderolabs/talos/releases/download/${{ steps.talos-version.outputs.release }}/talosctl-linux-amd64
          chmod +x talosctl
          sudo mv talosctl /usr/local/bin/
          talosctl version --client

      - name: Run Local Test Script
        run: |
          make test-local
        env:
          CLEANUP: "true"
